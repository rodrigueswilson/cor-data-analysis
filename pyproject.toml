[tool.poetry]
name = "cor-data-analysis"
version = "0.1.0"
description = "Modern system for MP3 and JPG metadata collection, aggregation, reporting, and visualization"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "cor_data_analysis", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
pandas = "^2.0.0"
mutagen = "^1.46.0"  # For MP3 metadata
pillow = "^10.0.0"   # For JPG metadata
openpyxl = "^3.1.2"  # For Excel output
matplotlib = "^3.7.1" # For chart generation
pydantic = "^2.0.0"  # For configuration
typer = "^0.9.0"     # For CLI

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.1"
black = "^23.3.0"
isort = "^5.12.0"
mypy = "^1.3.0"
flake8 = "^6.0.0"
pytest-cov = "^4.1.0"
types-pillow = "^10.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
